<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Slither Arena: Multi-Theme Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 8px;
      transition: background 0.3s ease;
    }

    .arena-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 94vh;
      max-height: 680px;
      background: #020617;
      border: 3px solid #38bdf8;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.3s ease;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      font-weight: 800;
      font-size: 0.85rem;
      z-index: 5;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-radius: 10px;
      padding: 5px 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .action-btn:active { transform: scale(0.94); }

    canvas {
      display: block;
      width: 100%;
      flex: 1;
      background: #064e3b;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }

    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 2rem; color: #38bdf8; margin-bottom: 8px; }
    .overlay p { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 24px; line-height: 1.4; }

    .play-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 15px 40px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .play-btn:active { transform: scale(0.95); }

    .boost-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .boost-btn:active { transform: scale(0.9); }
  </style>
</head>
<body>

  <div class="arena-wrapper" id="arenaBox">
    <div class="top-bar">
      <div>⭐ <span id="scoreVal">0</span></div>
      <div>🐍 LEN: <span id="lengthVal">12</span></div>
      <div class="btn-group">
        <button id="themeBtn" class="action-btn">🎨 THEME</button>
        <button id="audioBtn" class="action-btn">🔊 SFX</button>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <button id="boostBtn" class="boost-btn">⚡</button>

    <div id="startScreen" class="overlay">
      <h2 id="themeTitle">🌿 NATURAL SAFARI</h2>
      <p>Drag finger to slither smoothly<br>Switch themes live anytime!</p>
      <button id="startBtn" class="play-btn">START HUNT 🚀</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h2>💥 ELIMINATED!</h2>
      <p>Final Score: <span id="finalScore">0</span> PTS</p>
      <button id="restartBtn" class="play-btn">TRY AGAIN 🔁</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const arenaBox = document.getElementById("arenaBox");
    const scoreVal = document.getElementById("scoreVal");
    const lengthVal = document.getElementById("lengthVal");
    const startScreen = document.getElementById("startScreen");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const finalScore = document.getElementById("finalScore");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const boostBtn = document.getElementById("boostBtn");
    const themeBtn = document.getElementById("themeBtn");
    const audioBtn = document.getElementById("audioBtn");
    const themeTitle = document.getElementById("themeTitle");

    let animationId;
    let gameRunning = false;
    let score = 0;
    let isBoosting = false;
    let isMuted = false;

    // --- 4 Natural & Eye-Friendly Color Palettes ---
    const themes = [
      {
        name: "🌿 Natural Safari",
        bg1: "#064e3b",
        bg2: "#022c22",
        grid: "rgba(255, 255, 255, 0.04)",
        border: "#10b981",
        player: "#f59e0b",
        playerGlow: "rgba(245, 158, 11, 0.7)",
        aiColors: ["#dc2626", "#0284c7", "#84cc16"],
        foodColors: ["#ef4444", "#fbbf24", "#34d399", "#f43f5e"]
      },
      {
        name: "🌊 Deep Ocean",
        bg1: "#0c4a6e",
        bg2: "#082f49",
        grid: "rgba(56, 189, 248, 0.05)",
        border: "#0284c7",
        player: "#00f0ff",
        playerGlow: "rgba(0, 240, 255, 0.7)",
        aiColors: ["#f43f5e", "#fb923c", "#a855f7"],
        foodColors: ["#38bdf8", "#67e8f9", "#f472b6", "#e0e7ff"]
      },
      {
        name: "🌅 Sunset Glow",
        bg1: "#4c0519",
        bg2: "#2e020d",
        grid: "rgba(251, 146, 60, 0.05)",
        border: "#f43f5e",
        player: "#fbbf24",
        playerGlow: "rgba(251, 191, 36, 0.7)",
        aiColors: ["#8b5cf6", "#06b6d4", "#ec4899"],
        foodColors: ["#fb923c", "#f43f5e", "#fbbf24", "#c084fc"]
      },
      {
        name: "🍬 Pastel Candy",
        bg1: "#1e1b4b",
        bg2: "#0f0e26",
        grid: "rgba(192, 132, 252, 0.05)",
        border: "#c084fc",
        player: "#38bdf8",
        playerGlow: "rgba(56, 189, 248, 0.7)",
        aiColors: ["#f472b6", "#4ade80", "#facc15"],
        foodColors: ["#f472b6", "#fb7185", "#38bdf8", "#a7f3d0"]
      }
    ];

    let currentThemeIdx = 0;

    function applyTheme(idx) {
      const t = themes[idx];
      arenaBox.style.borderColor = t.border;
      themeTitle.textContent = t.name.toUpperCase();
      themeTitle.style.color = t.border;
      themeBtn.textContent = t.name.split(" ")[0] + " THEME";

      if (playerSnake) {
        playerSnake.primary = t.player;
        playerSnake.glow = t.playerGlow;
      }
    }

    themeBtn.addEventListener("click", () => {
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      applyTheme(currentThemeIdx);
      playEatChime();
    });

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight - 48;
    }
    window.addEventListener("resize", resize);

    // --- Audio Engine ---
    let audioCtx;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, duration = 0.08, type = "sine", gainLvl = 0.1) {
      if (isMuted || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainLvl, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function playEatChime() {
      initAudio();
      if (isMuted || !audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      const note = notes[Math.floor(Math.random() * notes.length)];
      playTone(note, 0.1, "sine", 0.12);
    }

    function playCrashSound() {
      initAudio();
      if (isMuted || !audioCtx) return;
      playTone(120, 0.4, "sawtooth", 0.25);
    }

    audioBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      audioBtn.textContent = isMuted ? "🔇 MUTED" : "🔊 SFX";
    });

    // --- Food Orbs ---
    let foods = [];
    function spawnFood(x, y) {
      const curTheme = themes[currentThemeIdx];
      const col = curTheme.foodColors[Math.floor(Math.random() * curTheme.foodColors.length)];
      foods.push({
        x: x || Math.random() * (canvas.width - 24) + 12,
        y: y || Math.random() * (canvas.height - 24) + 12,
        radius: 4.5 + Math.random() * 2.5,
        color: col,
        pulse: Math.random() * Math.PI * 2
      });
    }

    // --- Snake Physics ---
    class SmoothSnake {
      constructor(x, y, primaryColor, glowColor, isPlayer = false) {
        this.x = x;
        this.y = y;
        this.primary = primaryColor;
        this.glow = glowColor;
        this.isPlayer = isPlayer;
        this.radius = 10;
        this.length = 12;
        this.body = [];
        this.angle = Math.random() * Math.PI * 2;
        this.speed = 3.0;

        for (let i = 0; i < this.length * 4; i++) {
          this.body.push({ x: this.x, y: this.y });
        }
      }

      update(targetX, targetY, isBoost) {
        let currentSpeed = isBoost && this.length > 5 ? this.speed * 1.8 : this.speed;

        if (this.isPlayer) {
          const dx = targetX - this.x;
          const dy = targetY - this.y;
          const targetAngle = Math.atan2(dy, dx);
          let diff = targetAngle - this.angle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          this.angle += diff * 0.14;
        } else {
          if (Math.random() < 0.04) this.angle += (Math.random() - 0.5) * 1.4;
        }

        this.x += Math.cos(this.angle) * currentSpeed;
        this.y += Math.sin(this.angle) * currentSpeed;

        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;

        this.body.unshift({ x: this.x, y: this.y });
        while (this.body.length > this.length * 4) this.body.pop();
      }

      draw() {
        ctx.save();
        ctx.shadowColor = this.glow;
        ctx.shadowBlur = 10;

        for (let i = this.body.length - 1; i >= 0; i -= 3) {
          const pt = this.body[i];
          const segRadius = Math.max(3.5, this.radius - (i / this.body.length) * 5.5);
          
          ctx.fillStyle = this.primary;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, segRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, segRadius * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }

        // Head
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        const eyeAngle1 = this.angle + 0.58;
        const eyeAngle2 = this.angle - 0.58;
        const eyeDist = this.radius * 0.7;

        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(this.x + Math.cos(eyeAngle1) * eyeDist, this.y + Math.sin(eyeAngle1) * eyeDist, 2.8, 0, Math.PI * 2);
        ctx.arc(this.x + Math.cos(eyeAngle2) * eyeDist, this.y + Math.sin(eyeAngle2) * eyeDist, 2.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    let playerSnake;
    let aiSnakes = [];
    let touchTarget = { x: 0, y: 0 };

    function initGame() {
      resize();
      foods = [];
      for (let i = 0; i < 35; i++) spawnFood();

      const curTheme = themes[currentThemeIdx];
      playerSnake = new SmoothSnake(canvas.width / 2, canvas.height / 2, curTheme.player, curTheme.playerGlow, true);
      touchTarget = { x: canvas.width / 2, y: canvas.height / 2 };

      aiSnakes = [
        new SmoothSnake(60, 60, curTheme.aiColors[0], curTheme.aiColors[0], false),
        new SmoothSnake(canvas.width - 60, canvas.height - 60, curTheme.aiColors[1], curTheme.aiColors[1], false),
        new SmoothSnake(canvas.width - 60, 60, curTheme.aiColors[2], curTheme.aiColors[2], false)
      ];

      score = 0;
      scoreVal.textContent = "0";
      lengthVal.textContent = "12";
      applyTheme(currentThemeIdx);
    }

    function handlePointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      touchTarget.x = clientX - rect.left;
      touchTarget.y = clientY - rect.top;
    }

    window.addEventListener("touchmove", (e) => {
      if (e.touches && e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener("touchstart", (e) => {
      if (e.touches && e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener("mousemove", (e) => handlePointer(e.clientX, e.clientY));

    boostBtn.addEventListener("touchstart", (e) => { e.preventDefault(); isBoosting = true; }, { passive: false });
    boostBtn.addEventListener("touchend", () => { isBoosting = false; });
    boostBtn.addEventListener("mousedown", () => { isBoosting = true; });
    boostBtn.addEventListener("mouseup", () => { isBoosting = false; });

    function drawThemeBackground() {
      const curTheme = themes[currentThemeIdx];
      const grad = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 20,
        canvas.width / 2, canvas.height / 2, canvas.width
      );
      grad.addColorStop(0, curTheme.bg1);
      grad.addColorStop(1, curTheme.bg2);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = curTheme.grid;
      ctx.lineWidth = 1;
      const step = 32;
      for (let x = 0; x < canvas.width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function update() {
      if (!gameRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawThemeBackground();

      for (let i = foods.length - 1; i >= 0; i--) {
        let f = foods[i];
        f.pulse += 0.06;
        const currentR = f.radius + Math.sin(f.pulse) * 1.2;

        ctx.save();
        ctx.shadowColor = f.color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(f.x, f.y, currentR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        ctx.beginPath();
        ctx.arc(f.x, f.y, currentR * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const dist = Math.hypot(playerSnake.x - f.x, playerSnake.y - f.y);
        if (dist < playerSnake.radius + currentR) {
          foods.splice(i, 1);
          score += 20;
          playerSnake.length += 1;
          scoreVal.textContent = score;
          lengthVal.textContent = playerSnake.length;
          playEatChime();
          spawnFood();
        }
      }

      playerSnake.update(touchTarget.x, touchTarget.y, isBoosting);
      playerSnake.draw();

      aiSnakes.forEach(ai => {
        ai.update(0, 0, false);
        ai.draw();

        for (let j = 0; j < ai.body.length; j += 4) {
          const b = ai.body[j];
          if (Math.hypot(playerSnake.x - b.x, playerSnake.y - b.y) < playerSnake.radius + 3) {
            endGame();
            return;
          }
        }
      });

      animationId = requestAnimationFrame(update);
    }

    function startGame() {
      initAudio();
      initGame();
      startScreen.classList.add("hidden");
      gameOverScreen.classList.add("hidden");
      gameRunning = true;
      update();
    }

    function endGame() {
      gameRunning = false;
      playCrashSound();
      cancelAnimationFrame(animationId);
      finalScore.textContent = score;
      gameOverScreen.classList.remove("hidden");
    }

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);

    initGame();
  </script>
</body>
</html>
