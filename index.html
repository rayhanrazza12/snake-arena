<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Slither Arena: Royal Safari Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 8px;
    }

    .arena-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 94vh;
      max-height: 680px;
      background: #064e3b;
      border: 3px solid #d97706;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #062e24;
      border-bottom: 2px solid #047857;
      font-weight: 800;
      font-size: 0.9rem;
      z-index: 5;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #scoreVal { color: #fbbf24; }
    #lengthVal { color: #34d399; }

    .audio-btn {
      background: #064e3b;
      border: 1px solid #10b981;
      color: #f8fafc;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100%;
      flex: 1;
      background: #064e3b;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 30, 24, 0.94);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }

    .overlay.hidden { display: none; }
    
    .overlay h2 {
      font-size: 2rem;
      color: #fbbf24;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .overlay p {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-bottom: 22px;
    }

    .score-banner {
      background: rgba(6, 78, 59, 0.8);
      border: 1px solid #10b981;
      padding: 8px 24px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 1.1rem;
      color: #f8fafc;
      margin-bottom: 24px;
    }

    .btn-group-vertical {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 240px;
    }

    .modal-btn {
      border: none;
      padding: 13px 20px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.08s, opacity 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .modal-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    .btn-secondary {
      background: #047857;
      color: #ffffff;
      border: 1px solid #10b981;
    }

    .btn-danger {
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #dc2626;
    }

    .boost-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 2px solid #fbbf24;
      background: rgba(217, 119, 6, 0.85);
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .boost-btn:active {
      transform: scale(0.92);
      background: #b45309;
    }
  </style>
</head>
<body>

  <div class="arena-wrapper">
    <div class="top-bar">
      <div class="stat-badge">⭐ SCORE: <span id="scoreVal">0</span></div>
      <div class="stat-badge">🐍 LEN: <span id="lengthVal">12</span></div>
      <button id="audioToggleBtn" class="audio-btn">🔊 SFX</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <button id="boostBtn" class="boost-btn">⚡</button>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
      <h2>🐍 ROYAL SLITHER</h2>
      <p>Drag finger or mouse to slither smoothly</p>
      <div class="btn-group-vertical">
        <button id="startBtn" class="modal-btn btn-primary">START GAME ▶</button>
      </div>
    </div>

    <!-- Game Over Screen with Retry, New Game, Exit -->
    <div id="gameOverScreen" class="overlay hidden">
      <h2>💥 ELIMINATED!</h2>
      <div class="score-banner">Final Score: <span id="finalScore">0</span> PTS</div>
      
      <div class="btn-group-vertical">
        <button id="retryBtn" class="modal-btn btn-primary">🔄 RETRY</button>
        <button id="newGameBtn" class="modal-btn btn-secondary">⚡ NEW GAME</button>
        <button id="exitBtn" class="modal-btn btn-danger">🚪 MAIN MENU (EXIT)</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreVal = document.getElementById("scoreVal");
    const lengthVal = document.getElementById("lengthVal");
    const startScreen = document.getElementById("startScreen");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const finalScore = document.getElementById("finalScore");

    const startBtn = document.getElementById("startBtn");
    const retryBtn = document.getElementById("retryBtn");
    const newGameBtn = document.getElementById("newGameBtn");
    const exitBtn = document.getElementById("exitBtn");
    const boostBtn = document.getElementById("boostBtn");
    const audioToggleBtn = document.getElementById("audioToggleBtn");

    let animationId;
    let gameRunning = false;
    let score = 0;
    let isBoosting = false;
    let isMuted = false;

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight - 48;
    }
    window.addEventListener("resize", resize);

    // --- Audio Engine ---
    let audioCtx;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, duration = 0.08, type = "sine", gainLvl = 0.1) {
      if (isMuted || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainLvl, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function playEatChime() {
      initAudio();
      if (isMuted || !audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      const note = notes[Math.floor(Math.random() * notes.length)];
      playTone(note, 0.09, "sine", 0.12);
    }

    function playCrashSound() {
      initAudio();
      if (isMuted || !audioCtx) return;
      playTone(130, 0.35, "sawtooth", 0.22);
    }

    audioToggleBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      audioToggleBtn.textContent = isMuted ? "🔇 MUTED" : "🔊 SFX";
    });

    // --- Fruit / Food Orbs ---
    let foods = [];
    const fruitColors = ["#ef4444", "#fbbf24", "#34d399", "#f87171", "#fb923c"];

    function spawnFood(x, y) {
      const col = fruitColors[Math.floor(Math.random() * fruitColors.length)];
      foods.push({
        x: x || Math.random() * (canvas.width - 24) + 12,
        y: y || Math.random() * (canvas.height - 24) + 12,
        radius: 4.5 + Math.random() * 2.5,
        color: col,
        pulse: Math.random() * Math.PI * 2
      });
    }

    // --- Snake Physics & Smooth Movement ---
    class OrganicSnake {
      constructor(x, y, primaryColor, isPlayer = false) {
        this.x = x;
        this.y = y;
        this.primary = primaryColor;
        this.isPlayer = isPlayer;
        this.radius = 10;
        this.length = 12;
        this.body = [];
        this.angle = Math.random() * Math.PI * 2;
        this.speed = 2.9;

        for (let i = 0; i < this.length * 4; i++) {
          this.body.push({ x: this.x, y: this.y });
        }
      }

      update(targetX, targetY, isBoost) {
        let currentSpeed = isBoost && this.length > 5 ? this.speed * 1.8 : this.speed;

        if (this.isPlayer) {
          const dx = targetX - this.x;
          const dy = targetY - this.y;
          const targetAngle = Math.atan2(dy, dx);
          let diff = targetAngle - this.angle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          this.angle += diff * 0.14;
        } else {
          if (Math.random() < 0.04) this.angle += (Math.random() - 0.5) * 1.4;
        }

        this.x += Math.cos(this.angle) * currentSpeed;
        this.y += Math.sin(this.angle) * currentSpeed;

        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;

        this.body.unshift({ x: this.x, y: this.y });
        while (this.body.length > this.length * 4) this.body.pop();
      }

      draw() {
        ctx.save();

        for (let i = this.body.length - 1; i >= 0; i -= 3) {
          const pt = this.body[i];
          const segRadius = Math.max(3.5, this.radius - (i / this.body.length) * 5);
          
          ctx.fillStyle = this.primary;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, segRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, segRadius * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }

        // Head
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        const eyeAngle1 = this.angle + 0.58;
        const eyeAngle2 = this.angle - 0.58;
        const eyeDist = this.radius * 0.7;

        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(this.x + Math.cos(eyeAngle1) * eyeDist, this.y + Math.sin(eyeAngle1) * eyeDist, 2.8, 0, Math.PI * 2);
        ctx.arc(this.x + Math.cos(eyeAngle2) * eyeDist, this.y + Math.sin(eyeAngle2) * eyeDist, 2.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    let playerSnake;
    let aiSnakes = [];
    let touchTarget = { x: 0, y: 0 };

    function initGame() {
      resize();
      foods = [];
      for (let i = 0; i < 35; i++) spawnFood();

      // Golden Python Player Snake
      playerSnake = new OrganicSnake(canvas.width / 2, canvas.height / 2, "#fbbf24", true);
      touchTarget = { x: canvas.width / 2, y: canvas.height / 2 };

      // Safari AI Snakes
      aiSnakes = [
        new OrganicSnake(60, 60, "#dc2626", false),
        new OrganicSnake(canvas.width - 60, canvas.height - 60, "#0284c7", false),
        new OrganicSnake(canvas.width - 60, 60, "#84cc16", false)
      ];

      score = 0;
      scoreVal.textContent = "0";
      lengthVal.textContent = "12";
    }

    function handlePointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      touchTarget.x = clientX - rect.left;
      touchTarget.y = clientY - rect.top;
    }

    window.addEventListener("touchmove", (e) => {
      if (e.touches && e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener("touchstart", (e) => {
      if (e.touches && e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener("mousemove", (e) => handlePointer(e.clientX, e.clientY));

    boostBtn.addEventListener("touchstart", (e) => { e.preventDefault(); isBoosting = true; }, { passive: false });
    boostBtn.addEventListener("touchend", () => { isBoosting = false; });
    boostBtn.addEventListener("mousedown", () => { isBoosting = true; });
    boostBtn.addEventListener("mouseup", () => { isBoosting = false; });

    // Safari Natural Background
    function drawBackground() {
      const grad = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 30,
        canvas.width / 2, canvas.height / 2, canvas.width
      );
      grad.addColorStop(0, "#065f46");
      grad.addColorStop(1, "#064e3b");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      ctx.lineWidth = 1;
      const step = 32;
      for (let x = 0; x < canvas.width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function update() {
      if (!gameRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();

      // Food items
      for (let i = foods.length - 1; i >= 0; i--) {
        let f = foods[i];
        f.pulse += 0.06;
        const currentR = f.radius + Math.sin(f.pulse) * 0.8;

        ctx.save();
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(f.x, f.y, currentR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        ctx.beginPath();
        ctx.arc(f.x, f.y, currentR * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const dist = Math.hypot(playerSnake.x - f.x, playerSnake.y - f.y);
        if (dist < playerSnake.radius + currentR) {
          foods.splice(i, 1);
          score += 20;
          playerSnake.length += 1;
          scoreVal.textContent = score;
          lengthVal.textContent = playerSnake.length;
          playEatChime();
          spawnFood();
        }
      }

      playerSnake.update(touchTarget.x, touchTarget.y, isBoosting);
      playerSnake.draw();

      aiSnakes.forEach(ai => {
        ai.update(0, 0, false);
        ai.draw();

        for (let j = 0; j < ai.body.length; j += 4) {
          const b = ai.body[j];
          if (Math.hypot(playerSnake.x - b.x, playerSnake.y - b.y) < playerSnake.radius + 3) {
            endGame();
            return;
          }
        }
      });

      animationId = requestAnimationFrame(update);
    }

    function startGame() {
      initAudio();
      initGame();
      startScreen.classList.add("hidden");
      gameOverScreen.classList.add("hidden");
      gameRunning = true;
      update();
    }

    function endGame() {
      gameRunning = false;
      playCrashSound();
      cancelAnimationFrame(animationId);
      finalScore.textContent = score;
      gameOverScreen.classList.remove("hidden");
    }

    // Button Listeners
    startBtn.addEventListener("click", startGame);
    retryBtn.addEventListener("click", startGame);
    newGameBtn.addEventListener("click", startGame);

    exitBtn.addEventListener("click", () => {
      gameOverScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });

    initGame();
  </script>
</body>
</html>
